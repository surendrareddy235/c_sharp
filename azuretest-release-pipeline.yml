trigger: none
pr: none

resources:
  pipelines:
  - pipeline: buildPipeline
    source: build
    trigger: true

stages:
- stage: TestDeploy
  displayName: "Deploy to Test"
  jobs:
  - deployment: DeployToVM
    pool:
      name: 'Default'
    environment: 'Test'
    strategy:
      runOnce:
        deploy:
          steps:

          # Download your single artifact (s.zip)
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'specific'
              project: $(System.TeamProject)
              pipeline: $(resources.pipeline.buildPipeline.runID)
              artifactName: 'drop'
              downloadPath: '$(Pipeline.Workspace)'

          # Extract s.zip directly into IIS folder
          - task: ExtractFiles@1
            displayName: "Extract s.zip into IIS"
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/drop/s.zip'
              destinationFolder: 'C:\inetpub\wwwroot\c_sharp'
              cleanDestinationFolder: true

          # Restart IIS
          - powershell: |
              iisreset
            displayName: "Restart IIS"
