trigger: none
pr: none

resources:
  pipelines:
  - pipeline: buildPipeline
    source: build
    trigger: true

stages:
- stage: TestDeploy
  displayName: "Deploy to Test"
  jobs:
  - deployment: DeployToVM
    pool:
      name: 'Default'
    environment: 'Test'
    strategy:
      runOnce:
        deploy:
          steps:

          # Extract drop.zip downloaded by Azure
          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: '$(System.ArtifactsDirectory)/buildPipeline/drop/drop.zip'
              destinationFolder: 'C:\inetpub\wwwroot\c_sharp'
              cleanDestinationFolder: true

          - powershell: |
              iisreset
            displayName: "Restart IIS"
